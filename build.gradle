plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.74'
}

version = mod_version
group = mod_group_id

// immersive_munitions-1.21.1-<version>.jar: the Minecraft version is in the name, the feature version is shared with 1.20.1
base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    runs {
        configureEach {
            // its own folder, so the 1.21.1 dev game never touches the 1.20.1 worlds and configs in run/
            gameDirectory = project.file('run-1.21.1')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    // JEI
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    // Immersive Engineering and TaCZ, from Modrinth's Maven
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    implementation "maven.modrinth:immersiveengineering:${ie_version}"
    implementation "maven.modrinth:timeless-and-classics-zero:${tacz_version}"
    // IE's recipe codecs; IE bundles the library, so we only compile against it
    compileOnly "malte0811:DualCodecs:${dualcodecs_version}"

    // JEI: we compile against its API only (client/jei, our recipes in JEI when it's installed; optional for players),
    // and run the full mod in the dev game
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range, loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    // the license and third-party notices ship with the mod (the logo's frame is MIT, which requires its notice)
    from('LICENSE', 'NOTICE.md')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '2000']
}
