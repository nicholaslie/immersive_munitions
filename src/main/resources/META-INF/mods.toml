modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
authors="${mod_authors}"
credits="Zinc/brass textures derived from Scorched Guns Brass by Ribs (GPLv3). Creative side tabs adapted from TaCZ (GPLv3). Built on Immersive Engineering by BluSunrize. See NOTICE.md."
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="immersiveengineering"
mandatory=true
versionRange="[1.20.1-10.2.0-182,)"
ordering="AFTER"
side="BOTH"

# Optional: if present we load after it and suppress our own zinc worldgen.
[[dependencies.${mod_id}]]
modId="immersivegeology"
mandatory=false
versionRange="[0.9.0,)"
ordering="AFTER"
side="BOTH"

# TaCZ supplies the final ammunition item and ammo-ID API.
[[dependencies.${mod_id}]]
modId="tacz"
mandatory=true
versionRange="[1.2.0-hotfix,)"
ordering="AFTER"
side="BOTH"
