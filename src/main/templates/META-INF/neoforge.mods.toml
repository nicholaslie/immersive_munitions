modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
authors="${mod_authors}"
credits="Zinc and brass textures recolored from Immersive Engineering's art. Creative side tabs adapted from TaCZ (GPLv3). Logo frame from Immersive Farming (MIT). Built on Immersive Engineering by BluSunrize. See NOTICE.md."
description='''${mod_description}'''

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="immersiveengineering"
type="required"
versionRange="[12.4,)"
ordering="AFTER"
side="BOTH"

# Optional: if present we load after it and step aside for its zinc.
[[dependencies.${mod_id}]]
modId="immersivegeology"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# TaCZ supplies the final ammunition item and ammo-ID API.
[[dependencies.${mod_id}]]
modId="tacz"
type="required"
versionRange="[1.2.0-hotfix,)"
ordering="AFTER"
side="BOTH"
